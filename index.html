<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Untitled Document</title>
    <style type="text/css">
        body {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(242, 247, 200);
            font-size: 1rem;
        }
        #ruler {
            position: relative;
            left: 0px;
            top: 0px;
            margin-bottom: 5px;
        }
        #column{
            width: 170px;
            background-color: rgb(248, 198, 229);
        }
        h4, p{ padding: 0 10px;}
        h4{ padding-top: 20px;}
        p{ padding-bottom: 20px;}
    </style>
</head>
<body> 
    <img id="ruler" src="ruler.png" alt="ruler" width="700" height="200">
    <div id="column">
        <h4>An h4 heading</h4>
        <p>The heading and this paragraph sit in a column with a width of 170px.
        Because they are block level elements, their boxes expand horizontally to fill their containing element.</p>
    </div>
</body>
</html>
